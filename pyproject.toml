[build-system]
requires = [
    "setuptools>=64",
    "pybind11>=2.10",
    "cmake>=3.20",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cuda-nvcc-cu12",
]
build-backend = "setuptools.build_meta"

[project]
name = "carl"
version = "0.1.0"
description = "CUDA Rocket League simulation"
requires-python = ">=3.8"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
torch = ["torch"]
jax = ["jax[cuda12]"]
dev = ["pytest", "black", "ruff"]

[tool.setuptools]
ext-modules = [{name = "carl", sources = []}]

[build-system]
requires = [
    "setuptools>=77",
    "pybind11>=2.10",
    "cmake>=3.24",
]
build-backend = "setuptools.build_meta"

[project]
name            = "carl"
version         = "0.1.0"
description     = "CUDA Rocket League simulation"
requires-python = ">=3.10"
license         = "MIT"
dependencies = [
    "gymnasium>=1.0",
    "numpy>=1.24",
    "torch>=2.0",
]

[project.optional-dependencies]
jax = [
    "jax[cuda12]>=0.4.30; sys_platform == 'linux'",
]
rlgym = [
    "rlgym[rl-sim]>=2.0",
]

[dependency-groups]
dev = [
    "black>=24.0",
    "ruff>=0.6",
]

[tool.black]
target-version = ["py310"]

[tool.ruff]
target-version = "py310"

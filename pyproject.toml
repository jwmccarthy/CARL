[build-system]
requires = [
    "setuptools>=64",
    "pybind11>=2.10",
    "cmake>=3.20",
]
build-backend = "setuptools.build_meta"

[project]
name = "carl"
version = "0.1.0"
description = "CUDA Rocket League simulation"
requires-python = ">=3.10"

[project.optional-dependencies]
gymnasium = [
    "gymnasium>=1.0",
    "numpy>=1.24",
    "torch>=2.0",
]
jax = [
    "jax[cuda12]>=0.4.30; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "black>=24.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.black]
target-version = ["py310"]

[tool.ruff]
target-version = "py310"
